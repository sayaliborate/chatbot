<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AI Chatbot</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at top, #020617, #000000);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: #00ff9c;
    }

    .chat-container {
      width: 420px;
      height: 560px;
      background: #000;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0,255,156,0.35);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-header {
      background: #020617;
      padding: 14px;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      border-bottom: 1px solid #00ff9c;
      text-shadow: 0 0 6px #00ff9c;
    }

    .chat-subtitle {
      font-size: 12px;
      color: #7fffd4;
      margin-top: 4px;
    }

    .chat-box {
      flex: 1;
      padding: 12px;
      overflow-y: auto;
    }

    .message {
      margin-bottom: 12px;
      padding: 10px 14px;
      border-radius: 10px;
      max-width: 80%;
      font-size: 14px;
      line-height: 1.5;
    }

    .user {
      margin-left: auto;
      background: rgba(0,255,156,0.15);
      color: #00ff9c;
    }

    .bot {
      margin-right: auto;
      background: #020617;
      color: #e5fff5;
      border: 1px solid rgba(0,255,156,0.25);
    }

    .chat-input {
      display: flex;
      border-top: 1px solid #00ff9c;
      background: #000;
    }

    .chat-input input {
      flex: 1;
      padding: 14px;
      border: none;
      outline: none;
      background: transparent;
      color: #00ff9c;
      font-size: 14px;
    }

    .chat-input input::placeholder {
      color: #5eead4;
    }

    .chat-input button {
      padding: 14px 20px;
      border: none;
      background: #00ff9c;
      color: #000;
      cursor: pointer;
      font-weight: bold;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }

    .chat-input button:hover {
      transform: scale(1.05);
      box-shadow: 0 0 10px #00ff9c;
    }

    .footer {
      text-align: center;
      font-size: 12px;
      padding: 6px;
      color: #7fffd4;
      background: #020617;
      border-top: 1px solid rgba(0,255,156,0.3);
    }

    /* Scrollbar */
    .chat-box::-webkit-scrollbar {
      width: 6px;
    }

    .chat-box::-webkit-scrollbar-thumb {
      background: #00ff9c;
      border-radius: 10px;
    }
  </style>
</head>

<body>

  <div class="chat-container">
    <div class="chat-header">
      🤖 AI Chatbot
      <div class="chat-subtitle">Ask anything, get instant answers</div>
    </div>

    <div class="chat-box" id="chatBox">
      <div class="message bot">
        Hi 👋 I'm your AI assistant.<br/>
        You can ask me questions in simple language.
      </div>
    </div>

    <div class="chat-input">
      <input
        type="text"
        id="messageInput"
        placeholder="Type your question here..."
        onkeydown="if(event.key==='Enter') sendMessage()"
      />
      <button onclick="sendMessage()">Send</button>
    </div>

    <div class="footer">
      Developed by Sayali 💚
    </div>
  </div>

  <script>
    async function sendMessage() {
      const input = document.getElementById("messageInput");
      const chatBox = document.getElementById("chatBox");
      const message = input.value.trim();

      if (!message) return;

      chatBox.innerHTML += `
        <div class="message user">${message}</div>
      `;
      input.value = "";
      chatBox.scrollTop = chatBox.scrollHeight;

      try {
        const response = await fetch("http://127.0.0.1:8000/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ message })
        });

        const data = await response.json();

        chatBox.innerHTML += `
          <div class="message bot">${data.reply}</div>
        `;
        chatBox.scrollTop = chatBox.scrollHeight;

      } catch (error) {
        chatBox.innerHTML += `
          <div class="message bot">Sorry, something went wrong 😕</div>
        `;
      }
    }
  </script>

</body>
</html>
